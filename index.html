<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Savers</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d17; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 3s ease-in-out; }
  canvas.visible { opacity: 1; }
</style>
</head>
<body>
<!-- Savers register themselves with window.Savers. The LAST one listed here is the
     most recent and is shown first (handy for debugging/development). -->
<script src="savers/registry.js"></script>
<script src="savers/balls-in-a-line.js"></script>
<script src="savers/curved-balls.js"></script>
<script src="host.js"></script>
</body>
</html>
